---
layout: null
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website theme picker</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font:14px system-ui,sans-serif; color:#172b46; background:#f5f7fa; }
    header { padding:16px 22px; background:#fff; border-bottom:1px solid #dce5ed; }
    h1 { font-size:18px; margin:0 0 12px; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
    label { display:flex; align-items:center; gap:8px; }
    button,input { font:inherit; }
    button { cursor:pointer; border:1px solid #dce5ed; background:#fff; color:#172b46; border-radius:6px; padding:8px 12px; min-height:40px; }
    button[aria-pressed="true"] { border-color:#172b46; box-shadow:inset 0 0 0 1px #172b46; }
    button i { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:7px; background:var(--swatch); }
    input[type=color] { width:44px; height:40px; padding:3px; border:1px solid #dce5ed; background:#fff; border-radius:6px; cursor:pointer; }
    input[type=text] { width:94px; padding:9px; border:1px solid #dce5ed; border-radius:6px; font-family:monospace; }
    .note { margin:12px 0 0; color:#62666d; font-size:12px; }
    iframe { display:block; width:100%; height:calc(100dvh - 180px); min-height:600px; border:0; background:#fff; }
    #status { color:#62666d; }
  </style>
</head>
<body>
  <header>
    <h1>Single-accent theme picker</h1>
    <div class="controls">
      <label>Accent <input id="color" type="color" value="#245da8"></label>
      <label>Hex <input id="hex" type="text" value="#245da8" maxlength="7" pattern="#[0-9a-fA-F]{6}" aria-label="Accent hex color"></label>
      <div id="presets" class="controls" aria-label="Theme presets"></div>
      <button id="reset" type="button">Saved site theme</button>
      <span id="status" role="status"></span>
    </div>
    <p class="note">Preview only · All highlights use one color · Your saved site stays unchanged</p>
  </header>
  <iframe id="preview" src="{{ '/' | relative_url }}" title="Actual website theme preview"></iframe>
  <script>
    const presets = [ ['Original blue','#245da8'], ['Indigo','#5146a0'], ['Plum','#85517d'], ['Terracotta','#a34d37'], ['Deep teal','#276f73'], ['Graphite','#526171'] ];
    const picker=document.getElementById('color');
    const hex=document.getElementById('hex');
    const frame=document.getElementById('preview');
    const status=document.getElementById('status');
    let selected='#245da8';
    let savedSiteColor=selected;
    const buttons=[];
    const rgb=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
    const mix=(a,b,t)=>'#'+a.map((v,i)=>Math.round(v*(1-t)+b[i]*t).toString(16).padStart(2,'0')).join('');
    function apply(color) {
      if (!/^#[0-9a-f]{6}$/i.test(color)) return;
      selected=color.toLowerCase();picker.value=selected;hex.value=selected;
      for(const {button,color: preset} of buttons) button.setAttribute('aria-pressed',String(preset===selected));
      const doc=frame.contentDocument;
      if(!doc?.documentElement) return;
      let style=doc.getElementById('theme-picker-overrides');
      if(!style) {style=doc.createElement('style');style.id='theme-picker-overrides';doc.head.appendChild(style);}
      const channels=rgb(selected);
      const hover=mix(channels,[0,0,0],0.25);
      const tint=mix(channels,[255,255,255],0.94);
      const soft=mix(channels,[255,255,255],0.90);
      const border=mix(channels,[255,255,255],0.76);
      style.textContent=`:root {--accent:${selected};--accent-hover:${hover};--accent-soft:${soft};--dots-color:rgba(${channels.join(',')},0.23);} .intro-section {background-color:${tint};} .publication-links .button {border-color:${border};} .button.is-light:hover,.button.is-ghost:hover,.footer .footer-links a:hover {border-color:${border};background:${tint};} a:hover {color:${hover};}`;
      frame.contentWindow.dispatchEvent(new Event('theme-preview-change'));
      const luminance=channels.map(v=>{v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
      const contrast=1.05/(0.2126*luminance[0]+0.7152*luminance[1]+0.0722*luminance[2]+0.05);
      status.textContent=contrast<4.5?'Try a darker shade for readable links.':selected;
    }
    for(const [name,color] of presets) {
      const button=document.createElement('button');button.type='button';button.style.setProperty('--swatch',color);button.innerHTML=`<i aria-hidden="true"></i>${name}`;button.setAttribute('aria-pressed',String(color===selected));button.addEventListener('click',()=>apply(color));document.getElementById('presets').appendChild(button);buttons.push({button,color});
    }
    picker.addEventListener('input',()=>apply(picker.value));
    hex.addEventListener('input',()=>{hex.setCustomValidity(/^#[0-9a-f]{6}$/i.test(hex.value)?'':'Enter a six-digit hex color, such as #245da8.');apply(hex.value);});
    document.getElementById('reset').addEventListener('click',()=>apply(savedSiteColor));
    frame.addEventListener('load',()=>{
      const accent=frame.contentWindow.getComputedStyle(frame.contentDocument.documentElement).getPropertyValue('--accent').trim();
      if (/^#[0-9a-f]{6}$/i.test(accent)) savedSiteColor=accent;
      apply(savedSiteColor);
    });
  </script>
</body>
</html>
